# OSV/Dependabot (section 10). Security updates are opened immediately; version updates weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '05:00', timezone: Africa/Cairo }
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Expo SDK packages move together with `npx expo install --fix` (docs/runbooks/dependencies.md).
      - dependency-name: 'expo*'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-native*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/admin]
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly }
