name: Setup
description: Node 22 + pnpm with a cached store, then a frozen install.
inputs:
  filter:
    description: Optional pnpm --filter for a partial install
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install
      shell: bash
      run: |
        if [ -n "${{ inputs.filter }}" ]; then pnpm install --frozen-lockfile --filter "${{ inputs.filter }}"; else pnpm install --frozen-lockfile; fi
