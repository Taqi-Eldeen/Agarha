name: Setup
description: Node 22 + pnpm with a cached store, then a frozen install.
inputs:
  filter:
    description: Optional pnpm --filter for a partial install
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        if [ -n "$FILTER" ]; then pnpm install --frozen-lockfile --filter "$FILTER"; else pnpm install --frozen-lockfile; fi
