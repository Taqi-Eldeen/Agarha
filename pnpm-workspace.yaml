packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
  - argon2
  - esbuild
  - sharp
# Expo SDK 57 pins safe-area-context 5.7 / React 19.2; RN Storybook and @types/react-dom ask for newer
# patch/minor releases that are API-compatible.
peerDependencyRules:
  allowedVersions:
    react-native-safe-area-context: '5.7'
    '@types/react': '19.2'

# Security floor for transitive dependencies (Trivy/OSV findings; see docs/runbooks/dependencies.md).
overrides:
  sharp@<0.35.4: ^0.35.4
  postcss@<8.5.18: ^8.5.18
  uuid@<11.1.1: ^11.1.1

# Supply-chain hardening: no git/tarball URLs in transitive dependencies, wait 7 days before
# installing a newly published version, and refuse packages whose trust evidence got weaker.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
