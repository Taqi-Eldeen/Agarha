# Local environment (section 10): Postgres + PostGIS, Redis and MinIO (S3-compatible) with both buckets.
#   docker compose -f infra/docker-compose.yml up -d            # dependencies only (run apps with pnpm dev)
#   docker compose -f infra/docker-compose.yml --profile app up  # also the API, worker, web and admin images
# Ports can be moved with env vars (PG_PORT, REDIS_PORT, MINIO_PORT) if something already listens.
name: agarha

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: agarha
      POSTGRES_PASSWORD: agarha
      POSTGRES_DB: agarha
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'log_min_duration_statement=500']
    ports: ['${PG_PORT:-5432}:5432']
    volumes: ['pg-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agarha -d agarha']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing community images in 2025; pgsty builds the same source (ADR-0014).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ['${MINIO_PORT:-9000}:9000', '${MINIO_CONSOLE_PORT:-9001}:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates public-media (anonymous read, served via the CDN in cloud envs) and private-docs (no public access).
  minio-buckets:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minio minio-secret &&
        mc mb --ignore-existing local/public-media local/private-docs &&
        mc anonymous set download local/public-media &&
        mc anonymous set none local/private-docs &&
        echo buckets ready

  # --- application images (profile "app") ------------------------------------------------------
  migrate:
    profiles: [app]
    build: { context: .., dockerfile: apps/api/Dockerfile, target: migrate }
    environment: { DATABASE_URL: postgres://agarha:agarha@postgres:5432/agarha }
    depends_on: { postgres: { condition: service_healthy } }

  api:
    profiles: [app]
    build: { context: .., dockerfile: apps/api/Dockerfile, target: api }
    env_file: [../apps/api/.env.example]
    environment: &app-env
      NODE_ENV: production
      APP_ENV: local
      DATABASE_URL: postgres://agarha:agarha@postgres:5432/agarha
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: http://localhost:${MINIO_PORT:-9000}/public-media
      LOG_LEVEL: info
    ports: ['${API_PORT:-4000}:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-buckets: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: .., dockerfile: apps/api/Dockerfile, target: worker }
    env_file: [../apps/api/.env.example]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_MEDIA_URL: http://localhost:${MINIO_PORT:-9000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        NEXT_PUBLIC_PUBLIC_SITE: 'on'
    environment: { API_INTERNAL_URL: 'http://api:4000' }
    ports: ['3000:3000']
    depends_on: [api]

  admin:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args: { NEXT_PUBLIC_API_URL: 'http://localhost:${API_PORT:-4000}' }
    ports: ['3001:3001']
    depends_on: [api]

volumes:
  pg-data:
  redis-data:
  minio-data:
